spring:
  application:
    name: portfolio-manager
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/portfolio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

marketdata:
  twelvedata:
    api-key: ${TWELVE_DATA_API_KEY:}
  openexchangerates:
    api-key: ${OPENEXCHANGERATES_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

twelve-data:
  base-url: https://api.twelvedata.com
  api-key: ${TWELVE_DATA_API_KEY:}
